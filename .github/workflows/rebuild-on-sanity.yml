name: Rebuild archive on Sanity publish

on:
  repository_dispatch:
    types: [sanity-publish]
  workflow_dispatch:

env:
  PUBLIC_SANITY_PROJECT_ID: '9n512feo'
  PUBLIC_SANITY_DATASET: 'production'
  PUBLIC_SANITY_API_VERSION: '2026-09-01'

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -F @bureau/web build

      - name: Deploy to Cloudflare Pages
        run: npx wrangler@4 pages deploy apps/web/dist --project-name bureau-events --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
